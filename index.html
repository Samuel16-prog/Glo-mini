<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOUSD Advanced Protocol Hub</title>
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #131722;
            --accent-green: #00ca72;
            --accent-red: #ff3b30;
            --text-main: #f5f6f8;
            --text-secondary: #787b86;
            --border-color: #2a2e39;
            --button-blue: #2962ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 932px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .screen-tabs {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 24px;
        }

        .tab-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .tab-item.active {
            color: #ffffff;
            background-color: #1c2030;
        }

        .staking-tier-label {
            color: #ff9800;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .market-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .market-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .switch-control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-switch-mock {
            width: 34px;
            height: 18px;
            background-color: var(--button-blue);
            border-radius: 9px;
            position: relative;
        }

        .toggle-switch-mock::after {
            content: '';
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            right: 2px;
            top: 2px;
        }

        .badge-danger {
            background-color: #ff3b30;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10px;
        }

        .price-metrics-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ticker-price-text {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .ticker-pct-text {
            font-size: 12px;
            color: var(--accent-red);
            font-weight: 600;
        }

        .chart-svg-container {
            width: 100%;
            height: 80px;
        }

        .rewards-banner-card {
            background: linear-gradient(135deg, #1e222d 0%, #131722 100%);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .rewards-headline-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .rewards-running-sum {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-green);
            margin-top: 4px;
        }

        .compound-action-button {
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(0, 202, 114, 0.3);
        }

        .execution-workspace-panel {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-bottom: 16px;
        }

        .desk-tabs-balance-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .mode-toggles {
            display: flex;
            gap: 16px;
            font-size: 15px;
            font-weight: 600;
        }

        .mode-tab-item {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .mode-tab-item.active {
            color: var(--button-blue);
            border-bottom: 2px solid var(--button-blue);
            padding-bottom: 4px;
        }

        .wallet-readout-box {
            text-align: right;
        }

        .wallet-readout-lbl {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .wallet-readout-num {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 2px;
        }

        .volume-counter-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .interactive-counter-shell {
            display: flex;
            align-items: center;
            background-color: #0d0f14;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }

        .inc-dec-trigger-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 2px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .numerical-count-view {
            color: var(--text-main);
            font-weight: bold;
            padding: 0 6px;
        }

        .presets-horizontal-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .preset-unit-btn {
            background-color: #1e222d;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 0;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .preset-unit-btn.active {
            background-color: var(--button-blue);
            border-color: var(--button-blue);
            color: #ffffff;
            font-weight: bold;
        }

        .slider-indicator-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .range-slider-input-element {
            width: 100%;
            margin-bottom: 18px;
            accent-color: var(--button-blue);
        }

        .trigger-configuration-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }

        .checkbox-container-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .dual-inputs-layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .field-input-box-display {
            background-color: #1e222d;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            margin-top: 4px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
        }

        .projection-estimation-label {
            margin-top: 4px;
            font-size: 10px;
        }

        .bottom-action-bar-tray {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: #131722;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
